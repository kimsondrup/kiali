syntax = "proto3";

// A trimmed copy of Jaeger's api_v3 query service IDL, jaegertracing/jaeger-idl
// proto/api_v3/query_service.proto at v0.14.0: the requests of the three RPCs
// Kiali calls, and nothing else. The two search RPCs answer with
// OTLP, which the published go.opentelemetry.io/proto/otlp types already
// describe, so no response type and no OTLP code is generated here.
//
// Field numbers match upstream, and the numbers Kiali does not send are
// reserved rather than dropped, so wire compatibility survives a regeneration.
package jaeger.api_v3;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "opentelemetry/proto/trace/v1/trace.proto";

option go_package = "github.com/kiali/kiali/tracing/jaeger/apiv3;apiv3";

// Request object to get a trace.
message GetTraceRequest {
  // Hex encoded 64 or 128 bit trace ID.
  string trace_id = 1;

  // 2 and 3 narrow the search to a time window, which a trace detail request
  // carries no window to fill; 4 asks for the trace exactly as stored, where
  // Kiali wants the clock-skew-adjusted one that is the default.
  reserved 2, 3, 4;
}

// Query parameters to find traces.
//
// All fields form a conjunction, except for search_depth. They are matched
// against individual spans, not against the trace, and the results include
// every trace with at least one matching span, in no guaranteed order.
message TraceQueryParameters {
  // service_name filters spans generated by a specific service.
  string service_name = 1;

  // attributes are matched against span and resource attributes; at least one
  // span must match all of them. Kiali sends istio.cluster_id on every query
  // and the error flag on some, so a request that drops them is not narrower
  // but answers with every trace in the store.
  //
  // The HTTP API expects this as a URL-encoded JSON string map.
  map<string, string> attributes = 3;

  // start_time_min is the start of the time interval (inclusive). Required.
  //
  // The HTTP API uses RFC-3339ns format.
  google.protobuf.Timestamp start_time_min = 4;

  // start_time_max is the end of the time interval (exclusive). Required.
  //
  // The HTTP API uses RFC-3339ns format.
  google.protobuf.Timestamp start_time_max = 5;

  // duration_min is the minimum duration of a span in the trace.
  //
  // The HTTP API uses Go's duration format (e.g. "10s").
  google.protobuf.Duration duration_min = 6;

  // search_depth bounds the search, much like an SQL LIMIT. A backend may
  // treat it as approximate, so a larger value generally returns more traces.
  int32 search_depth = 8;

  // 2 is operation_name and 7 duration_max, neither of which any Kiali caller
  // supplies; 9 asks for the trace exactly as stored. 10 is the Alpha
  // structured filter, the only field that would pull in expression/v1, and a
  // server without the jaeger.query.structuredFilters gate refuses a request
  // carrying it rather than widening the query. 11 is pagination, which
  // FindTraces rejects with InvalidArgument because TracesData has no field
  // to carry a continuation token.
  reserved 2, 7, 9, 10, 11;
}

// Request object to search traces.
message FindTracesRequest {
  TraceQueryParameters query = 1;
}

// Request object to get service names.
message GetServicesRequest {}

// Response object to get service names.
message GetServicesResponse {
  repeated string services = 1;
}

service QueryService {
  // GetTrace returns a single trace.
  // Note that the JSON response over HTTP is wrapped into result envelope
  // "{"result": ...}", so it cannot be unmarshalled as a TracesData directly.
  rpc GetTrace(GetTraceRequest) returns (stream opentelemetry.proto.trace.v1.TracesData) {}

  // FindTraces searches for traces. A trace may straddle two messages of the
  // stream, so the chunks have to be accumulated.
  // See GetTrace for JSON unmarshalling.
  rpc FindTraces(FindTracesRequest) returns (stream opentelemetry.proto.trace.v1.TracesData) {}

  // GetServices returns service names.
  rpc GetServices(GetServicesRequest) returns (GetServicesResponse) {}
}
